<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AM41</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AM41">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c0e; color: #f2f3f5;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  #view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #title { position: absolute; top: 22px; left: 26px; pointer-events: none; }
  #title b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
  #title span { color: #9aa0a8; }
  #controls { display: none; position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; pointer-events: none; }
  button { -webkit-appearance: none; appearance: none; font: inherit; color: inherit; cursor: pointer; pointer-events: auto;
    touch-action: manipulation; border: 1px solid #3a3e45; border-radius: 22px; background: rgba(24,26,30,.9);
    min-height: 44px; padding: 0 20px; margin: 4px; }
  .chip.on { background: #f2f3f5; border-color: #f2f3f5; color: #0b0c0e; }
  #loader, #error { position: absolute; top: 50%; left: 50%; width: 300px; margin: -40px 0 0 -150px; text-align: center; }
  #track { height: 3px; border-radius: 2px; background: #2a2d33; margin-top: 12px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #f2f3f5; }
  #error { display: none; }
  #placeholder { display: none; position: absolute; top: 24px; right: 26px; padding: 7px 12px; border-radius: 8px;
    background: #b3261e; color: #fff; font-weight: 600; pointer-events: none; }
  #stats { display: none; position: absolute; left: 26px; right: 26px; bottom: 84px; color: #9aa0a8; font: 11px/1.4 Menlo, monospace;
    white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="title"><b>AM41</b><span>4+1 VTOL flying wing</span></div>
<div id="placeholder">Test geometry: not the AM41</div>
<div id="loader"><div id="msg">Loading aircraft</div><div id="track"><div id="bar"></div></div></div>
<div id="error"><p id="error-text"></p><button id="retry">Try again</button></div>
<div id="stats"></div>
<div id="controls"><button id="reset">Reset view</button></div>
<script src="app.js"></script>
</body>
</html>
